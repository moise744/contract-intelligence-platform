version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: melange
      POSTGRES_USER: melange_user
      POSTGRES_PASSWORD: melange_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgres://melange_user:melange_password@db:5432/melange
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=1
      - OPENAI_API_KEY=${OPENAI_API_KEY}

  celery:
    build: .
    command: celery -A config worker -l info
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgres://melange_user:melange_password@db:5432/melange
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=1
      - OPENAI_API_KEY=${OPENAI_API_KEY}

volumes:
  postgres_data:
